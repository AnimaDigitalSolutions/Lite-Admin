# Production deployment configuration
# Runs on the server after images are loaded from CI/CD tars
# Media bind mount at /opt/lite-admin/uploads/ for host nginx access

services:
  backend:
    image: ${BACKEND_IMAGE}:${VERSION:-latest}
    container_name: lite-admin-backend
    ports:
      - "${REMOTE_BACKEND_PORT:-3001}:3001"
    env_file:
      - ${ENV_FILE:-./.env}
    environment:
      - NODE_ENV=production
      - PORT=3001
      - TRUST_PROXY=true
      - UPLOAD_DIR=/app/uploads
      - DATABASE_DIR=/app/database
    volumes:
      - /opt/lite-admin/uploads:/app/uploads
      - /opt/lite-admin/database:/app/database
      - /opt/lite-admin/logs:/app/logs
    restart: unless-stopped
    networks:
      - lite-admin-network
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 10s

  admin:
    image: ${ADMIN_IMAGE}:${VERSION:-latest}
    container_name: lite-admin-admin
    ports:
      - "${REMOTE_ADMIN_PORT:-3002}:3002"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${API_URL:-http://localhost:3001}
    restart: unless-stopped
    networks:
      - lite-admin-network

networks:
  lite-admin-network:
    driver: bridge
