name: Deploy to Production

on:
  push:
    branches:
      - prod

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.32.1'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set environment variable
        run: echo "CI=false" >> $GITHUB_ENV

      - name: Build all applications
        run: pnpm build

      - name: Set Docker image names
        run: |
          FOLDER_NAME=$(basename $(pwd) | tr '[:upper:]' '[:lower:]' | tr '.' '-')
          BRANCH_NAME="_${GITHUB_REF#refs/heads/}"

          export COMPOSE_PROJECT_NAME="${FOLDER_NAME}${BRANCH_NAME}"
          echo "COMPOSE_PROJECT_NAME=$COMPOSE_PROJECT_NAME" >> $GITHUB_ENV

          echo "BACKEND_IMAGE=${COMPOSE_PROJECT_NAME}_backend" >> $GITHUB_ENV
          echo "ADMIN_IMAGE=${COMPOSE_PROJECT_NAME}_admin" >> $GITHUB_ENV

      - name: Build Docker images
        run: |
          docker compose -p ${{ env.COMPOSE_PROJECT_NAME }} -f docker/docker-compose.build.yml build --parallel

      - name: Display image IDs
        run: |
          docker images --filter "label=com.docker.compose.project=${{ env.COMPOSE_PROJECT_NAME }}" --format "table {{.Repository}}:{{.Tag}}\t{{.ID}}\t{{.Size}}"

      - name: Save Docker images as tar files
        run: |
          docker save ${{ env.BACKEND_IMAGE }}:latest | gzip > ${{ env.BACKEND_IMAGE }}.tar.gz
          docker save ${{ env.ADMIN_IMAGE }}:latest | gzip > ${{ env.ADMIN_IMAGE }}.tar.gz
          ls -lah *.tar.gz

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ vars.REMOTE_HOST_PROD }}
          username: ${{ vars.REMOTE_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.REMOTE_PORT }}
          source: "*.tar.gz,docker/,justfile"
          target: ./${{ env.COMPOSE_PROJECT_NAME }}/

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ vars.REMOTE_HOST_PROD }}
          username: ${{ vars.REMOTE_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.REMOTE_PORT }}
          script: |
            cd ${{ env.COMPOSE_PROJECT_NAME }}

            # Ensure host directories exist for bind mounts
            sudo mkdir -p /opt/lite-admin/{uploads/portfolio,uploads/thumbnails,database,logs}

            # Stop existing containers
            echo "Stopping existing containers..."
            docker compose -p ${{ env.COMPOSE_PROJECT_NAME }} -f docker/docker-compose.prod.yml down || true

            # Clean up old images
            echo "Cleaning up old images..."
            docker images --filter "label=com.docker.compose.project=${{ env.COMPOSE_PROJECT_NAME }}" -q | xargs -r docker rmi -f || true

            # Load new images
            echo "Loading new images..."
            gunzip -f *.tar.gz
            docker load -i ${{ env.BACKEND_IMAGE }}.tar
            docker load -i ${{ env.ADMIN_IMAGE }}.tar

            # Set environment variables for compose
            export BACKEND_IMAGE=${{ env.BACKEND_IMAGE }}
            export ADMIN_IMAGE=${{ env.ADMIN_IMAGE }}
            export VERSION=latest
            export ENV_FILE=./.env

            # Set port mappings from GitHub variables
            export REMOTE_BACKEND_PORT=${{ vars.REMOTE_BACKEND_PORT }}
            export REMOTE_ADMIN_PORT=${{ vars.REMOTE_ADMIN_PORT }}

            # Verify environment file exists
            ls -la docker/.env || ls -la .env || echo "Warning: No .env file found"

            # Start all services
            echo "Starting services..."
            docker compose -p ${{ env.COMPOSE_PROJECT_NAME }} -f docker/docker-compose.prod.yml up -d

            # Wait for services to start
            echo "Waiting for services to start..."
            sleep 15

            # Check service status
            docker compose -p ${{ env.COMPOSE_PROJECT_NAME }} -f docker/docker-compose.prod.yml ps

            # Check logs for errors
            docker compose -p ${{ env.COMPOSE_PROJECT_NAME }} -f docker/docker-compose.prod.yml logs --tail=20

            # Cleanup
            echo "Cleaning up..."
            rm -f *.tar

            echo "Deployment complete!"

      - name: Print deployment summary
        run: |
          echo "Deployment Summary"
          echo "===================="
          echo "Project: ${{ env.COMPOSE_PROJECT_NAME }}"
          echo "Branch: ${GITHUB_REF#refs/heads/}"
          echo "Commit: ${GITHUB_SHA}"
          echo "Deployed by: ${GITHUB_ACTOR}"
          echo "Deployment completed successfully!"
