name: Deploy Demo

on:
  push:
    branches:
      - demo

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.32.1'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set environment variable
        run: echo "CI=false" >> $GITHUB_ENV

      - name: Build admin in demo mode
        run: |
          # Demo mode is frontend-only — axios interceptor mocks all API calls
          export NEXT_PUBLIC_DEMO_MODE=true
          pnpm build

      - name: Set Docker image name
        run: |
          FOLDER_NAME=$(basename $(pwd) | tr '[:upper:]' '[:lower:]' | tr '.' '-')
          BRANCH_NAME="_demo"

          export COMPOSE_PROJECT_NAME="${FOLDER_NAME}${BRANCH_NAME}"
          echo "COMPOSE_PROJECT_NAME=$COMPOSE_PROJECT_NAME" >> $GITHUB_ENV
          echo "ADMIN_IMAGE=${COMPOSE_PROJECT_NAME}_admin" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build -t ${{ env.ADMIN_IMAGE }}:latest -f docker/Dockerfiles/Dockerfile.admin .

      - name: Save Docker image as tar
        run: |
          docker save ${{ env.ADMIN_IMAGE }}:latest | gzip > ${{ env.ADMIN_IMAGE }}.tar.gz
          ls -lah *.tar.gz

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ vars.REMOTE_HOST_DEMO }}
          username: ${{ vars.REMOTE_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.REMOTE_PORT }}
          source: "*.tar.gz,docker/docker-compose.demo.yml"
          target: ./${{ env.COMPOSE_PROJECT_NAME }}/

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ vars.REMOTE_HOST_DEMO }}
          username: ${{ vars.REMOTE_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.REMOTE_PORT }}
          script: |
            cd ${{ env.COMPOSE_PROJECT_NAME }}

            # Stop existing container
            echo "Stopping existing demo container..."
            docker compose -p ${{ env.COMPOSE_PROJECT_NAME }} -f docker/docker-compose.demo.yml down || true

            # Clean up old image
            echo "Cleaning up old image..."
            docker images --filter "reference=*demo*admin*" -q | xargs -r docker rmi -f || true

            # Load new image
            echo "Loading new image..."
            gunzip -f *.tar.gz
            docker load -i ${{ env.ADMIN_IMAGE }}.tar

            # Set environment variables for compose
            export ADMIN_IMAGE=${{ env.ADMIN_IMAGE }}
            export VERSION=latest
            export REMOTE_DEMO_PORT=${{ vars.REMOTE_DEMO_PORT }}

            # Start service
            echo "Starting demo..."
            docker compose -p ${{ env.COMPOSE_PROJECT_NAME }} -f docker/docker-compose.demo.yml up -d

            # Wait and check
            sleep 10
            docker compose -p ${{ env.COMPOSE_PROJECT_NAME }} -f docker/docker-compose.demo.yml ps

            # Cleanup
            rm -f *.tar
            echo "Demo deployment complete!"

      - name: Print deployment summary
        run: |
          echo "Demo Deployment Summary"
          echo "========================"
          echo "Project: ${{ env.COMPOSE_PROJECT_NAME }}"
          echo "Branch: demo"
          echo "Commit: ${GITHUB_SHA}"
          echo "Mode: Frontend-only (mocked API data)"
          echo "Deployed by: ${GITHUB_ACTOR}"
